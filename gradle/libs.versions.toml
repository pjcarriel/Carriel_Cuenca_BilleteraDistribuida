# ============================================================
# CATÁLOGO DE VERSIONES (Version Catalog)
# Aquí se escriben UNA sola vez las versiones de todas las librerías.
# Luego los archivos build.gradle.kts las usan con "libs.nombre".
# ============================================================

# [versions]: solo NOMBRES y NÚMEROS de versión; las secciones de abajo los usan con "version.ref".
[versions]
# Versión del plugin de Android para Gradle (AGP). La 9.x ya trae Kotlin integrado.
agp = "9.4.1"
# Utilidades de Kotlin para Android (extensiones de AndroidX).
coreKtx = "1.10.1"
# JUnit: pruebas unitarias.
junit = "4.13.2"
# Lifecycle: ViewModel y recolección de Flows respetando el ciclo de vida.
lifecycle = "2.8.7"
# Puente entre la Activity y Jetpack Compose.
activityCompose = "1.8.0"
# Versión de Kotlin (la usa el plugin del compilador de Compose).
kotlin = "2.2.10"
# BOM de Compose: fija versiones compatibles de todas las librerías de Compose.
composeBom = "2026.02.01"
# KSP: herramienta que GENERA código automáticamente (Room la necesita).
ksp = "2.3.6"
# Room: base de datos local SQLite con una capa fácil de usar.
room = "2.7.1"
# Retrofit: cliente REST que convierte una interfaz Kotlin en llamadas HTTP.
retrofit = "2.11.0"
# OkHttp: motor HTTP que usa Retrofit; también lo usamos para el WebSocket.
okhttp = "4.12.0"
# Corrutinas de Kotlin para Android (Dispatchers.IO y Dispatchers.Main).
coroutines = "1.10.1"
# Íconos extendidos de Material. Ya no están dentro del BOM, por eso llevan versión fija.
materialIconsExtended = "1.7.8"

# [libraries]: cada librería = group (organización) + name (artefacto) + versión.
# "version.ref" apunta a un nombre de [versions]. En Gradle se usa como libs.androidx.core.ktx
# (los guiones "-" del nombre se escriben como puntos).
[libraries]
# Extensiones de Kotlin para Android (core-ktx).
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# JUnit 4: pruebas UNITARIAS (corren en la PC).
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Permite usar setContent { } en la Activity para dibujar con Compose.
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# --- Lifecycle (ViewModel + Compose) ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Permite usar viewModel() dentro de una función @Composable.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Permite usar collectAsStateWithLifecycle() para leer un StateFlow desde Compose.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Jetpack Compose (sin versión: la pone el BOM) ---
# El BOM en sí (en app/build.gradle.kts se importa con platform(...)).
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Núcleo de la interfaz de Compose.
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# Colores, pinceles y gráficos (Color, Brush...).
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
# Componentes de Material 3 (Card, Button, AlertDialog...).
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Íconos como AccountBalanceWallet, Payments, Bolt, etc.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }

# --- Room (base de datos local) ---
# Librería principal de Room.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# Soporte de corrutinas y Flow para Room (funciones suspend y Flow en el DAO).
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# Generador de código de Room (lo ejecuta KSP al compilar).
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- Red: Retrofit + OkHttp ---
# Retrofit: llamadas REST.
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
# Convierte JSON <-> objetos Kotlin usando Gson.
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
# OkHttp: cliente HTTP y WebSocket.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Muestra en el Logcat cada petición y respuesta HTTP (útil para la defensa).
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# --- Corrutinas ---
# Incluye Dispatchers.Main para Android (y trae kotlinx-coroutines-core con Dispatchers.IO).
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# [plugins]: plugins de Gradle con su id y versión (se usan con alias(libs.plugins...)).
[plugins]
# Plugin de Android para construir la app (usa la versión de AGP).
android-application = { id = "com.android.application", version.ref = "agp" }
# Plugin del compilador de Compose (va con la misma versión de Kotlin).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Plugin KSP: procesa las anotaciones de Room (@Entity, @Dao, @Database) y genera código.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
