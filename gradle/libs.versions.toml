# ============================================================
# CATÁLOGO DE VERSIONES (Version Catalog)
# Aquí se escriben UNA sola vez las versiones de todas las librerías.
# Luego los archivos build.gradle.kts las usan con "libs.nombre".
# ============================================================

[versions]
# Versión del plugin de Android para Gradle (AGP). La 9.x ya trae Kotlin integrado.
agp = "9.4.1"
# Utilidades de Kotlin para Android (extensiones de AndroidX).
coreKtx = "1.10.1"
# Librerías de pruebas (vienen con la plantilla).
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
# Lifecycle: ViewModel y recolección de Flows respetando el ciclo de vida.
lifecycle = "2.8.7"
# Puente entre la Activity y Jetpack Compose.
activityCompose = "1.8.0"
# Versión de Kotlin (la usa el plugin del compilador de Compose).
kotlin = "2.2.10"
# BOM de Compose: fija versiones compatibles de todas las librerías de Compose.
composeBom = "2026.02.01"
# KSP: herramienta que GENERA código automáticamente (Room la necesita).
ksp = "2.3.6"
# Room: base de datos local SQLite con una capa fácil de usar.
room = "2.7.1"
# Retrofit: cliente REST que convierte una interfaz Kotlin en llamadas HTTP.
retrofit = "2.11.0"
# OkHttp: motor HTTP que usa Retrofit; también lo usamos para el WebSocket.
okhttp = "4.12.0"
# Corrutinas de Kotlin para Android (Dispatchers.IO y Dispatchers.Main).
coroutines = "1.10.1"
# Íconos extendidos de Material. Ya no están dentro del BOM, por eso llevan versión fija.
materialIconsExtended = "1.7.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# --- Lifecycle (ViewModel + Compose) ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Permite usar viewModel() dentro de una función @Composable.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Permite usar collectAsStateWithLifecycle() para leer un StateFlow desde Compose.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Jetpack Compose (sin versión: la pone el BOM) ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Íconos como AccountBalanceWallet, Payments, Bolt, etc.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }

# --- Room (base de datos local) ---
# Librería principal de Room.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# Soporte de corrutinas y Flow para Room (funciones suspend y Flow en el DAO).
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# Generador de código de Room (lo ejecuta KSP al compilar).
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- Red: Retrofit + OkHttp ---
# Retrofit: llamadas REST.
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
# Convierte JSON <-> objetos Kotlin usando Gson.
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
# OkHttp: cliente HTTP y WebSocket.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Muestra en el Logcat cada petición y respuesta HTTP (útil para la defensa).
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# --- Corrutinas ---
# Incluye Dispatchers.Main para Android (y trae kotlinx-coroutines-core con Dispatchers.IO).
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Plugin KSP: procesa las anotaciones de Room (@Entity, @Dao, @Database) y genera código.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
