# CONFIGURACIÓN GENERAL DE GRADLE para todo el proyecto (formato clave=valor).
# OJO: lo que se configure desde Android Studio REEMPLAZA lo que esté escrito aquí.
# Más información: http://www.gradle.org/docs/current/userguide/build_environment.html
# Opciones de la máquina virtual de Java (JVM) del "daemon" de Gradle (el proceso que compila):
# -Xmx2048m = hasta 2 GB de memoria; -Dfile.encoding=UTF-8 = lee bien las tildes y la ñ.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Modo PARALELO (compila varios módulos a la vez). Solo sirve si los módulos son independientes;
# está DESACTIVADO porque la línea de abajo está comentada. Más información:
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# CACHÉ DE CONFIGURACIÓN: si no cambió ningún archivo de compilación, Gradle se salta
# la fase de configuración y compila más rápido.
org.gradle.configuration-cache=true
# Estilo de código Kotlin del proyecto: "official" = la guía oficial de Kotlin (la otra opción es "obsolete").
kotlin.code.style=official